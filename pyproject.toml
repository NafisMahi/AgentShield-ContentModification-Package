[project]
name = "agentshield-local"
version = "0.3.0"
description = "Read a site's own products and articles from the project and inject hidden agent-directed prompts for indirect prompt-injection research."
requires-python = ">=3.9"
dependencies = [
  "pydantic>=2.10",
  "beautifulsoup4>=4.12",
  "PyYAML>=6.0",
]

[project.scripts]
agentshield = "agentshield.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agentshield*"]
